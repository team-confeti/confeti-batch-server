apple-music:
  api:
    host: https://external.confeti.asia
    path: /apple-music-api
    endpoints:
      base-url: https://api.music.apple.com
      path-prefix: /v1/catalog/kr
      artists-path:
        base: /artists
        single: /{id}
        multiple: ""
        relationship-by-name: /{id}/{relationship}
        relationship-view-by-name: /{id}/view/{view}
        songs: /{id}/songs
      albums-path:
        base: /albums
        single: /{id}
        multiple: ""
        relationship-by-name: /{id}/{relationship}
        relationship-view-by-name: /{id}/view/{view}
      songs-path:
        base: /songs
        single: /{id}
        multiple: ""
        relationship-by-name: /{id}/{relationship}
      search-path:
        base: /search
        single: ""
        hints: /hints
        suggestions: /suggestions
      charts-path:
        base: /charts

---
spring:
  config:
    activate:
      on-profile: prod
apple-music:
  api:
    host: https://external.confeti.asia
    path: /apple-music-api

---
spring:
  config:
    activate:
      on-profile: local
apple-music:
  api:
    host: localhost:4290
    path: /apple-music-api
